apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nexusdeploy-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: nexusdeploy.rules
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="default"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
        - alert: HighMemoryUsage
          expr: (container_memory_usage_bytes{namespace="default"} / container_spec_memory_limit_bytes{namespace="default"}) > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} memory usage above 85%"